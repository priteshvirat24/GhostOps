version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: ghostops-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: ghostops-web
    restart: always
    ports:
      - "3000:3000"
      - "80:3000"
    env_file:
      - .env
    depends_on:
      - api
